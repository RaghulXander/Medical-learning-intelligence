name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: medadmin
          POSTGRES_PASSWORD: medsecret_ci
          POSTGRES_DB: medical_exam_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U medadmin -d medical_exam_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      APP_ENV: test
      DATABASE_URL: postgresql://medadmin:medsecret_ci@127.0.0.1:5432/medical_exam_ci
      REDIS_URL: redis://127.0.0.1:6379/0
      JWT_SECRET_KEY: ci-only-secret-that-must-never-be-used-in-production
      CORS_ALLOWED_ORIGINS: http://localhost:3005
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Python dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Compile Python source
        run: python -m compileall -q backend database scripts
      - name: Upgrade fresh database
        run: alembic upgrade head
      - name: Verify migration revision
        run: alembic current --check-heads
      - name: Run Python tests
        run: pytest -q

  web-and-mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - name: Install workspace dependencies
        run: bun install --frozen-lockfile
      - name: Build shared packages
        run: |
          bun --filter @medical/shared build
          bun --filter @medical/api-client build
      - name: Typecheck web
        run: bun --filter web typecheck
      - name: Build web
        env:
          API_URL: http://127.0.0.1:8000
        run: bun --filter web build
      - name: Validate Expo dependencies
        run: bunx expo-doctor apps/mobile
      - name: Typecheck mobile
        run: bun --filter mobile typecheck

  backend-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build production backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.backend
          push: false
          tags: docedge-api:${{ github.sha }}
