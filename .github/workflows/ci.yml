name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      docs: ${{ steps.filter.outputs.docs }}
      backend: ${{ steps.filter.outputs.backend }}
      web_mobile: ${{ steps.filter.outputs.web_mobile }}
      docker: ${{ steps.filter.outputs.docker }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            docs:
              - 'docs/**'
              - 'mkdocs.yml'
              - 'requirements-docs.txt'
              - '.github/workflows/ci.yml'
            backend:
              - 'backend/**'
              - 'database/**'
              - 'migrations/**'
              - 'scripts/**'
              - 'tests/**'
              - 'alembic.ini'
              - 'requirements*.txt'
              - '.github/workflows/ci.yml'
            web_mobile:
              - 'apps/**'
              - 'packages/**'
              - 'package.json'
              - 'bun.lockb'
              - '.github/workflows/ci.yml'
            docker:
              - 'Dockerfile.backend'
              - 'infrastructure/**'
              - 'backend/**'
              - 'database/**'
              - 'migrations/**'
              - 'requirements.txt'
              - '.github/workflows/ci.yml'

  documentation:
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install documentation dependencies
        run: python -m pip install -r requirements-docs.txt
      - name: Build documentation strictly
        run: python -m mkdocs build --strict
      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy-documentation:
    needs: [changes, documentation]
    if: github.ref == 'refs/heads/main' && needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  backend:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: medadmin
          POSTGRES_PASSWORD: medsecret_ci
          POSTGRES_DB: medical_exam_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U medadmin -d medical_exam_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      APP_ENV: test
      DATABASE_URL: postgresql://medadmin:medsecret_ci@127.0.0.1:5432/medical_exam_ci
      REDIS_URL: redis://127.0.0.1:6379/0
      JWT_SECRET_KEY: ci-only-secret-that-must-never-be-used-in-production
      CORS_ALLOWED_ORIGINS: http://localhost:3005
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Python dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Compile Python source
        run: python -m compileall -q backend database scripts
      - name: Upgrade fresh database
        run: alembic upgrade head
      - name: Verify migration revision
        run: alembic current --check-heads
      - name: Run Python tests
        run: pytest -q

  web-and-mobile:
    needs: changes
    if: needs.changes.outputs.web_mobile == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - name: Install workspace dependencies
        run: bun install --frozen-lockfile
      - name: Build shared packages
        run: |
          bun --filter @medical/shared build
          bun --filter @medical/api-client build
      - name: Typecheck web
        run: bun --filter web typecheck
      - name: Validate CMS content
        run: bun run test:cms
      - name: Validate editor and mobile UI schemas
        run: bun run test:editor
      - name: Validate ontology explorer tree
        run: bun run test:ontology-ui
      - name: Build web
        env:
          API_URL: http://127.0.0.1:8000
        run: bun --filter web build
      - name: Validate Expo dependency versions
        working-directory: apps/mobile
        run: bunx expo install --check
      - name: Typecheck mobile
        run: bun --filter mobile typecheck
      - name: Export Android release bundle
        working-directory: apps/mobile
        env:
          EXPO_PUBLIC_API_URL: https://mobile-ci.invalid
          EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID: mobile-ci.apps.googleusercontent.com
        run: |
          bunx expo export --platform android --output-dir "$RUNNER_TEMP/mobile-export"
          grep -R -a -q "https://mobile-ci.invalid" "$RUNNER_TEMP/mobile-export"
          grep -R -a -q "mobile-ci.apps.googleusercontent.com" "$RUNNER_TEMP/mobile-export"

  backend-image:
    needs: changes
    if: needs.changes.outputs.docker == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build production backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.backend
          push: false
          tags: docedge-api:${{ github.sha }}
