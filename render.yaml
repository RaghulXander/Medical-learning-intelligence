services:
  - type: web
    name: docedge-api
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile.backend
    dockerCommand: /usr/local/bin/docedge-backend
    healthCheckPath: /api/ready
    autoDeploy: true
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: GOOGLE_CLIENT_IDS
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
