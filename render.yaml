services:
  - type: web
    name: docedge-api
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile.backend
    dockerCommand: sh -c "python -m alembic upgrade head && python -m uvicorn backend.api.main:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips='*'"
    healthCheckPath: /api/ready
    maxShutdownDelaySeconds: 30
    autoDeploy: true
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: docedge-postgres
          property: connectionString
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: GOOGLE_CLIENT_IDS
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        value: https://medprepai.netlify.app

databases:
  - name: docedge-postgres
    plan: free
    region: singapore
    postgresMajorVersion: "16"
    databaseName: docedge
    user: docedge
    ipAllowList: []
